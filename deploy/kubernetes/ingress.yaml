apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lazyrepo
spec:
  # Set ingressClassName to your cluster's controller if it has no default.
  # ingressClassName: nginx
  rules:
    - host: apt.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lazyrepo
                port:
                  name: http
  # Enable TLS after creating a certificate Secret in the same namespace.
  # tls:
  #   - hosts:
  #       - apt.example.com
  #     secretName: lazyrepo-tls
